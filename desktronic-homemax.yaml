esphome:
  name: desktronic-homemax
  friendly_name: Desktronic HomeMax

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3

external_components:
  - source:
      type: local
      path: components
    components: [ homemax_desk ]

uart:
  id: uart_bus
  tx_pin: GPIO21   # -> LV4 -> HV4 -> RJ12 pin 5 (desk RX)
  rx_pin: GPIO20   # <- LV3 <- HV3 <- RJ12 pin 3 (desk TX)
  baud_rate: 9600

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

homemax_desk:
  id: desk

  # Height and movement
  height:
    name: "Height"
  height_percent:
    name: "Height Percent"
  height_min:
    name: "Height Min"
  height_max:
    name: "Height Max"
  user_height_min:
    name: "User Height Min"
  user_height_max:
    name: "User Height Max"
  move_up:
    name: "Move up"
  move_down:
    name: "Move down"
  stop:
    name: "Stop"
  nudge_up:
    name: "Up 1 cm"
  nudge_down:
    name: "Down 1 cm"
  target_height:
    name: "Target Height"
    mode: box
  cover:
    name: "Desk"

  # Memory positions (the handset only has 1 and 2, the controller stores 4)
  position1:
    name: "Position 1"
  position2:
    name: "Position 2"
  position3:
    name: "Position 3"
  position4:
    name: "Position 4"
  position1_height:
    name: "Position 1 Height"
  position2_height:
    name: "Position 2 Height"
  position3_height:
    name: "Position 3 Height"
  position4_height:
    name: "Position 4 Height"
  save_position1:
    name: "Save Current as Position 1"
  save_position2:
    name: "Save Current as Position 2"
  save_position3:
    name: "Save Current as Position 3"
  save_position4:
    name: "Save Current as Position 4"
  set_position1:
    name: "Set Position 1"
    mode: box
  set_position2:
    name: "Set Position 2"
    mode: box
  set_position3:
    name: "Set Position 3"
    mode: box
  set_position4:
    name: "Set Position 4"
    mode: box
  refresh_positions:
    name: "Refresh Positions"

  # Status
  moving:
    name: "Moving"
  standing:
    name: "Standing"
  standing_time:
    name: "Standing Time Today"
  controller_connected:
    name: "Controller Connected"

  # Settings
  auto_limits: true        # read the height range and user limits from the controller
  min_height: 75           # cm, used until the controller reports its range
  max_height: 119          # cm
  standing_height: 95      # cm, from this height on you count as standing
  nudge_step: 1            # cm per press of Up 1 cm / Down 1 cm
  poll_interval: 60s       # how often to read user limits / check the connection, 0s = off

button:
  - platform: template
    name: "Desk Sit"
    icon: "mdi:chair-rolling"
    on_press:
      - lambda: "id(desk).goto_height(75);"

  - platform: template
    name: "Desk Stand"
    icon: "mdi:human-handsup"
    on_press:
      - lambda: "id(desk).goto_height(110);"

# Time from Home Assistant, used to reset the standing time at midnight
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: "id(desk).reset_standing_time();"

# Local control page at http://desktronic-homemax.local
web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  ap:
    ssid: "Livingroom Fallback Hotspot"
    password: !secret ap_password

captive_portal:

output:
  - platform: gpio
    pin: GPIO8
    id: led_out
    inverted: true

light:
  - platform: binary
    id: onboard_led
    name: "Onboard LED"
    output: led_out
