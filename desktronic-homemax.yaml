esphome:
  name: desktronic-homemax
  friendly_name: Desktronic HomeMax

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3

external_components:
  - source:
      type: local
      path: components
    components: [ homemax_desk ]

uart:
  id: uart_bus
  tx_pin: GPIO21   # -> LV4 -> HV4 -> RJ12 pin 5 (desk RX)
  rx_pin: GPIO20   # <- LV3 <- HV3 <- RJ12 pin 3 (desk TX)
  baud_rate: 9600

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

homemax_desk:
  id: desk

  # Height and movement
  height:
    name: "Height"
  move_up:
    name: "Move up"
  move_down:
    name: "Move down"
  stop:
    name: "Stop"
  target_height:
    name: "Target Height"
    mode: box
  cover:
    name: "Desk"

  # Memory positions
  position1:
    name: "Position 1"
  position2:
    name: "Position 2"
  position1_height:
    name: "Position 1 Height"
  position2_height:
    name: "Position 2 Height"
  save_position1:
    name: "Save Current as Position 1"
  save_position2:
    name: "Save Current as Position 2"
  set_position1:
    name: "Set Position 1"
    mode: box
  set_position2:
    name: "Set Position 2"
    mode: box
  refresh_positions:
    name: "Refresh Positions"

  # Status
  moving:
    name: "Moving"
    on_press:
      - light.turn_on:
          id: onboard_led
          effect: "Moving Blink"
    on_release:
      - light.turn_off: onboard_led
  standing:
    name: "Standing"
  standing_time:
    name: "Standing Time Today"

  # Settings
  move_duration: 1s        # how long Move up / Move down move per press
  stop_early: 5            # mm, stop this close to a target (desk coasts a bit)
  min_height: 75           # cm, your desk's lowest height (0% for the cover)
  max_height: 118          # cm, your desk's highest height (100% for the cover)
  standing_height: 105      # cm, from this height on you count as standing
  position1_command: 0x05  # change these if your controller uses other bytes
  position2_command: 0x06
  save_position1_command: 0x03
  save_position2_command: 0x04
  position1_report: 0x25
  position2_report: 0x26

button:
  - platform: template
    name: "Desk Sit"
    icon: "mdi:chair-rolling"
    on_press:
      - lambda: "id(desk).goto_height(75);"

  - platform: template
    name: "Desk Stand"
    icon: "mdi:human-handsup"
    on_press:
      - lambda: "id(desk).goto_height(110);"

# Time from Home Assistant, used to reset the standing time at midnight
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: "id(desk).reset_standing_time();"

# Local control page at http://desktronic-homemax.local
web_server:
  port: 80
  version: 3

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  ap:
    ssid: "Livingroom Fallback Hotspot"
    password: !secret ap_password

captive_portal:

output:
  - platform: gpio
    pin: GPIO8
    id: led_out
    inverted: true

light:
  - platform: binary
    id: onboard_led
    name: "Onboard LED"
    output: led_out
    effects:
      - strobe:
          name: "Moving Blink"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
