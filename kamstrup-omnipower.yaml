esphome:
  name: kamstrup-omnipower
  friendly_name: Kamstrup Omnipower

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3

# Keep logging on USB so it doesn't use the meter's UART
logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

# Meter HAN port DATA_OUT -> GPIO20 (default UART0 RX on the C3)
uart:
  rx_pin: GPIO20
  baud_rate: 2400
  rx_buffer_size: 1024

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  ap:
    ssid: "Kamstrup Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# Unencrypted HAN; add decryption_key/auth_key if the grid company enables encryption
dlms_meter:

# Kamstrup uses OBIS B=1 and sends unscaled integers, hence the multiply filters
sensor:
  - platform: dlms_meter
    obis_code: 1.1.1.7.0.255
    name: "Active power Import"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: dlms_meter
    obis_code: 1.1.2.7.0.255
    name: "Active power Export"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
